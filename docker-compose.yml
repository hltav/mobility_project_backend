services:
  backend:
    build:
      context: ./mobility_backend
      dockerfile: Dockerfile
    container_name: mobility_backend
    ports:
      - "8000:8000"

    # Preserve existing Laravel configuration at runtime, outside image layers.
    # Explicit environment entries below keep their existing precedence.
    env_file:
      - ./mobility_backend/.env

    environment:
      APP_ENV: local
      APP_DEBUG: "1"
      APP_URL: http://localhost:8000

      DB_CONNECTION: "${PGSQL_CONNECTION:?}"
      DB_HOST: "${PGSQL_HOST:?}"
      DB_PORT: "${PGSQL_PORT:?}"
      DB_DATABASE: "${PGSQL_DATABASE:?}"
      DB_USERNAME: "${PGSQL_USERNAME:?}"
      DB_PASSWORD: "${PGSQL_PASSWORD:?}"

      PGSQL_HOST: "${PGSQL_HOST:?}"
      PGSQL_PORT: "${PGSQL_PORT:?}"
      PGSQL_DATABASE: "${PGSQL_DATABASE:?}"
      PGSQL_USERNAME: "${PGSQL_USERNAME:?}"
      PGSQL_PASSWORD: "${PGSQL_PASSWORD:?}"

      REDIS_HOST: "${REDIS_HOST:-valkey}"
      REDIS_PORT: "${REDIS_PORT:-6379}"

      PROCESSOR_URL: http://processor:8080

      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}"
      GOOGLE_MAPS_KEY: "${GOOGLE_MAPS_KEY}"

    depends_on:
      postgres:
        condition: service_healthy
      processor:
        condition: service_started

    networks:
      - mobility
      - postgresql

  processor:
    build:
      context: ./mobility_processor
      dockerfile: Dockerfile
    container_name: mobility_processor
    ports:
      - "8080:8080"

    environment:
      PORT: "8080"

      DB_CONNECTION: "${PGSQL_CONNECTION:?}"
      DB_HOST: "${PGSQL_HOST:?}"
      DB_PORT: "${PGSQL_PORT:?}"
      DB_DATABASE: "${PGSQL_DATABASE:?}"
      DB_USERNAME: "${PGSQL_USERNAME:?}"
      DB_PASSWORD: "${PGSQL_PASSWORD:?}"

      PGSQL_HOST: "${PGSQL_HOST:?}"
      PGSQL_PORT: "${PGSQL_PORT:?}"
      PGSQL_DATABASE: "${PGSQL_DATABASE:?}"
      PGSQL_USERNAME: "${PGSQL_USERNAME:?}"
      PGSQL_PASSWORD: "${PGSQL_PASSWORD:?}"

      VALKEY_HOST: "${VALKEY_HOST:-valkey}"
      VALKEY_PORT: "${VALKEY_PORT:-6379}"

      SPTRANS_API_TOKEN: "${SPTRANS_API_TOKEN}"
      PROCESSOR_ADMIN_TOKEN: "${PROCESSOR_ADMIN_TOKEN}"
      SPTRANS_API_BASE_URL: "${SPTRANS_API_BASE_URL:-https://api.olhovivo.sptrans.com.br/v2.1}"

    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

    networks:
      - mobility
      - postgresql

networks:
  mobility:
    driver: bridge

  postgresql:
    internal: true
