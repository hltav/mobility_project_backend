version: '3.9'

services:
  backend:
    build:
      context: ./mobility_backend
      dockerfile: Dockerfile
    container_name: mobility_backend
    ports:
      - '8000:8000'
    environment:
      APP_ENV: local
      APP_DEBUG: '1'
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: mobility_project
      DB_USERNAME: mobility_user
      DB_PASSWORD: mobility_2026
      PROCESSOR_URL: http://processor:8080
      SPTRANS_API_TOKEN: '${SPTRANS_API_TOKEN}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET}'
      GOOGLE_REDIRECT_URI: '${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}'
      GOOGLE_MAPS_KEY: '${GOOGLE_MAPS_KEY}'
    depends_on:
      - mysql
      - processor
    networks:
      - mobility

  processor:
    build:
      context: ./mobility_processor
      dockerfile: Dockerfile
    container_name: mobility_processor
    ports:
      - '8080:8080'
    environment:
      PORT: '8080'
      SPTRANS_API_TOKEN: '${SPTRANS_API_TOKEN}'
      SPTRANS_API_BASE_URL: '${SPTRANS_API_BASE_URL:-https://api.olhovivo.sptrans.com.br/v2.1}'
    depends_on:
      - mysql
    networks:
      - mobility

networks:
  mobility:
    driver: bridge
