services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:e84455a058f60f06dd8c40e66a2c628b8fc113d9fca0896e1f308b25b897207f
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PGSQL_DATABASE:?PGSQL_DATABASE não definido}
      POSTGRES_USER: ${PGSQL_USERNAME:?PGSQL_USERNAME não definido}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:?PGSQL_PASSWORD não definido}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

    networks:
      - postgresql

  valkey:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped

    volumes:
      - valkey_data:/data

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mobility

volumes:
  postgres_data:
  valkey_data:

networks:
  postgresql:
    internal: true

  mobility:
    driver: bridge
